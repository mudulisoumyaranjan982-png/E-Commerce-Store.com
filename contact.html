<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SoumyaMart</title>
    <link rel="stylesheet" href="style.css">
    <!-- EmailJS Latest CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🛒 SoumyaMart</div>
            <div class="menu-toggle" onclick="toggleMenu()">
    ☰
</div>
            <ul class="nav-links">
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="products.html">📦 Products</a></li>
                <li><a href="cart.html">🛒 Cart</a></li>
                <li><a href="contact.html">📧 Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div style="text-align: center; margin-bottom: 3rem; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
            <h1 style="color: #232f3e; font-size: 2.5rem; margin-bottom: 1rem;">📧 Contact Us</h1>
            <p style="color: #666; font-size: 1.2rem;"> Your Message Will Be  Directly Sent To <strong>mudulisoumyaranjan494@gmail.com</strong> This Email Address</p>
        </div>
        
        <form id="contactForm" style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
            <input type="text" id="from_name" name="from_name" placeholder="👤 Your Name *" required style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;">
            <input type="email" id="from_email" name="from_email" placeholder="📧 Email *" required style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;">
            <input type="tel" id="from_phone" name="from_phone" placeholder="📱 Phone (Optional)" style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;">
            <textarea id="message" name="message" rows="6" placeholder="💬 Please enter your message *" required style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit;"></textarea>
            <button type="submit" class="btn" style="width: 100%; font-size: 1.2rem; padding: 1rem;">
                🚀 Send Message
            </button>
        </form>
        
        <div id="result" style="text-align: center; margin-top: 2rem; font-size: 1.2rem; min-height: 50px;"></div>
    </main>

    <script>
        // EmailJS Keys (तुम्हारे exact)
        window.emailjs.init("nHeXfcSjef0W6nACd");  // Public Key
        
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const result = document.getElementById('result');
            result.innerHTML = '⏳ Sending...';
            result.style.color = '#ff9900';
            
            // Form data collect
            const formData = {
                from_name: document.getElementById('from_name').value,
                from_email: document.getElementById('from_email').value,
                from_phone: document.getElementById('from_phone').value || 'N/A',
                message: document.getElementById('message').value
            };
            
            // EmailJS send
            emailjs.send('service_g2a5w33', 'template_3inpr38', formData)
                .then(function(response) {
                    result.innerHTML = '✅ Message is sent successfully! Please check your email for confirmation.';
                    result.style.color = '#28a745';
                    document.getElementById('contactForm').reset();
                    console.log('SUCCESS!', response.status, response.text);
                }, function(error) {
                    result.innerHTML = '❌ Error! EmailJS dashboard check करें:<br>' + error.text;
                    result.style.color = '#dc3545';
                    console.log('FAILED...', error);
                });
        });
    </script>
    
    <script src="script.js"></script>
</body>
</html>
